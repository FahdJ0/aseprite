
name: Aseprite Windows Download

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Get Aseprite source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Skia
        shell: bash
        run: |
          skia_url=$(source laf/misc/skia-url.sh | xargs)
          curl --ssl-revoke-best-effort -L -o skia.zip "$skia_url"
          unzip skia.zip -d skia

      - name: Install Ninja
        uses: aseprite/get-ninja@main

      - name: Configure Visual Studio
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Configure Aseprite
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DENABLE_TESTS=OFF \
            -DENABLE_SCRIPTING=ON \
            -DENABLE_CCACHE=OFF \
            -DLAF_BACKEND=skia \
            -DSKIA_DIR="$(realpath skia)" \
            -DSKIA_LIBRARY_DIR="$(realpath skia/out/Release-x64)"

      - name: Compile Aseprite
        shell: bash
        run: cmake --build build --parallel 2

      - name: Save Aseprite
        uses: actions/upload-artifact@v4
        with:
          name: Aseprite-Windows
          path: build/bin/
          if-no-files-found: error
